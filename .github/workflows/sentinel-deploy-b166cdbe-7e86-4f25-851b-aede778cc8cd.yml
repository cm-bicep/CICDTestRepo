name: Deploy Content to SentinelWorkspace2 [b166cdbe-7e86-4f25-851b-aede778cc8cd]
# Note: This workflow will deploy everything in the root directory.
# To deploy content only from a specific path (for example SentinelContent):
#   1. Add the target path to the "paths" property like such
#    paths:
#    - 'SentinelContent/**'
#    - '!.github/workflows/**'
#    - '.github/workflows/sentinel-deploy-b166cdbe-7e86-4f25-851b-aede778cc8cd.yml'
#   2. Append the path to the directory environment variable below
#       directory: '${{ github.workspace }}/SentinelContent'

on:
  push:
    branches: [ test/custom-detection ]
    paths:
    - '**'
    - '!.github/workflows/**'  # this filter prevents other workflow changes from triggering this workflow
    - '.github/workflows/sentinel-deploy-b166cdbe-7e86-4f25-851b-aede778cc8cd.yml'

jobs:
  deploy-content:
    runs-on: windows-latest
    env:
      resourceGroupName: 'SentinelRG'
      workspaceName: 'SentinelWorkspace2'
      workspaceId: '1e3a7f6c-2b64-4141-b72d-410e4a3bdc26'
      directory: '${{ github.workspace }}'
      cloudEnv: 'AzureCloud'
      contentTypes: 'CustomDetection'
      branch: 'test/custom-detection'
      sourceControlId: 'b166cdbe-7e86-4f25-851b-aede778cc8cd'
      rootDirectory: '${{ github.workspace }}'
      githubAuthToken: ${{ secrets.GITHUB_TOKEN }}
      smartDeployment: 'true'
    permissions:
      contents: write
      id-token: write # Require write permission to Fetch an OIDC token.

    steps:
    - name: Login to Azure (Attempt 1)
      continue-on-error: true
      id: login1
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_b166cdbe7e864f25851baede778cc8cd }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_b166cdbe7e864f25851baede778cc8cd }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_b166cdbe7e864f25851baede778cc8cd }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 1 failed
      if: ${{ steps.login1.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 2)
      continue-on-error: true
      id: login2
      uses: azure/login@v2
      if: ${{ steps.login1.outcome=='failure' }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_b166cdbe7e864f25851baede778cc8cd }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_b166cdbe7e864f25851baede778cc8cd }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_b166cdbe7e864f25851baede778cc8cd }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 2 failed
      if: ${{ steps.login2.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 3)
      continue-on-error: false
      id: login3
      uses: azure/login@v2
      if: ${{ steps.login2.outcome=='failure'  }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_b166cdbe7e864f25851baede778cc8cd }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_b166cdbe7e864f25851baede778cc8cd }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_b166cdbe7e864f25851baede778cc8cd }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Checkout
      uses: actions/checkout@v3

    - name: Deploy Content to Microsoft Sentinel
      uses: azure/powershell@v2
      with:
        azPSVersion: 'latest'
        inlineScript: |
          ${{ github.workspace }}//.github/workflows/azure-sentinel-deploy-b166cdbe-7e86-4f25-851b-aede778cc8cd.ps1